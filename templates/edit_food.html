{% extends "base.html" %}
{% block title %}Edit item{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Edit "{{ values.get('food_name', '') }}"</h1>
        <p class="text-muted small mb-4">Update the details and save your changes.</p>

        <form method="post" action="{{ url_for('food.edit_food', item_id=values.get('id')) }}">
          <div class="mb-3">
            <label for="food_name" class="form-label">Food name</label>
            <input type="text" class="form-control" id="food_name" name="food_name"
                   value="{{ values.get('food_name', '') }}" required maxlength="120">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" name="category">
                {% for c in categories %}
                <option value="{{ c }}" {{ 'selected' if values.get('category') == c }}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-3">
              <label for="quantity" class="form-label">Quantity</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="quantity"
                     name="quantity" value="{{ values.get('quantity', 1) }}" required>
            </div>
            <div class="col-3">
              <label for="unit" class="form-label">Unit</label>
              <select class="form-select" id="unit" name="unit">
                {% for u in units %}
                <option value="{{ u }}" {{ 'selected' if values.get('unit', 'pcs') == u }}>{{ u }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label for="purchase_date" class="form-label">Purchase date</label>
              <input type="date" class="form-control" id="purchase_date" name="purchase_date"
                     value="{{ values.get('purchase_date', '') }}" required>
            </div>
            <div class="col-6">
              <label for="expiry_date" class="form-label">Expiry date</label>
              <input type="date" class="form-control" id="expiry_date" name="expiry_date"
                     value="{{ values.get('expiry_date', '') }}" required>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-app flex-grow-1">
              <i class="bi bi-check2"></i> Save changes</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('food.inventory') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
