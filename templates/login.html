{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-muted small mb-4">Log in to your FoodWise account.</p>

        <form method="post" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="identifier" class="form-label">Username or email</label>
            <input type="text" class="form-control" id="identifier" name="identifier"
                   value="{{ form.get('identifier', '') }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password"
                   name="password" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-app w-100">
            <i class="bi bi-box-arrow-in-right"></i> Log in
          </button>
        </form>

        <hr>
        <p class="small text-center mb-2">
          New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
        <div class="demo-hint small text-center rounded-3 p-2">
          <i class="bi bi-info-circle"></i>
          Demo account for presentations: <code>demo_user</code> / <code>Demo@123</code>
          <span class="d-block text-muted">(run <code>python seed_demo.py</code> first)</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
