{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Create your account</h1>
        <p class="text-muted small mb-4">Free, local, and yours alone - each user
          only sees their own food data.</p>

        <form method="post" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ form.get('username', '') }}" required
                   minlength="3" autofocus>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ form.get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   required minlength="6">
            <div class="form-text">At least 6 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm" name="confirm"
                   required minlength="6">
          </div>
          <button type="submit" class="btn btn-app w-100">
            <i class="bi bi-person-plus"></i> Register
          </button>
        </form>

        <hr>
        <p class="small text-center mb-0">
          Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
